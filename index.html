<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Ofensiva de Treinos</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #f2f2f2, #d9d9d9);
            padding: 20px;
        }

        h1 {
            margin-top: 40px;
            color: #222;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);

            border-bottom: 3px solid #222;
            padding-bottom: 10px;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
        }

        #ofensiva {
            font-size: 20px;
            font-weight: bold;
            background-color: white;
            padding: 20px 40px;
            border: 10px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            margin-top: 20px;
            font-weight: bold;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #e63946;
            color: white;
            margin-top: 15px;
            transition: 0.2s;
            width: 220px;
        }

        .button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2s);
            background-color: #c92f3d;
        }

        .button:active {
            transform: scale(0.95);

        }

        #calendario {
            margin-top: 20px;
            width: 320px;
            min-height: 200px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 1px solid #ddd;

        }

        .dias-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            font-weight: bold;
            background-color: #f2f2f2;
            padding: 8px 0;
            border-radius: 6px;
        }

        .numeros {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .numeros span {
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ddd;
            font-size: 14px;
            height: 20px;
        }

        .numeros span:hover {
            background-color: #ddd;
        }

        .numeros span.marcado {
            background-color: black;
            color: white;
        }

        .dias-semana span {
            color: #666;
            font-size: 14px;
        }

        .numeros span.hoje {
            border: 2px solid black;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>OFENSIVA DE TREINOS</h1>

    <p id="ofensiva">Ofensiva atual: 0 dias</p>

    <button>Marcar treino de hoje</button>

    <div id="calendario">
        <h2>Setembro 2026</h2>
        <div class="dias-semana">
            <span>Dom</span>
            <span>Seg</span>
            <span>Ter</span>
            <span>Qua</span>
            <span>Qui</span>
            <span>Sex</span>
            <span>Sáb</span>
        </div>

        <div class="numeros">
            <span></span>
            <span></span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
            <span>11</span>
            <span>12</span>
            <span>13</span>
            <span>14</span>
            <span>15</span>
            <span>16</span>
            <span>17</span>
            <span>18</span>
            <span>19</span>
            <span>20</span>
            <span>21</span>
            <span>22</span>
            <span>23</span>
            <span>24</span>
            <span>25</span>
            <span>26</span>
            <span>27</span>
            <span>28</span>
            <span>29</span>
            <span>30</span>
        </div>
    </div>
    </div>

    <script>
        const botao =
            document.querySelector("button");

        const ofensiva =
            document.querySelector("#ofensiva");

        let dias = 0;
        let ultimoTreino = null;
        ultimoTreino = localStorage.getItem("ultimoTreino");
        dias = Number(localStorage.getItem("dias")) || 0;
        ofensiva.textContent = "Ofensiva atual:" + dias + "dias";

        botao.addEventListener("click",
            function () {
                const hoje = new Date();

                if (ultimoTreino === hoje.toDateString()) {
                    alert("Você já marcou o treino de hoje");
                    return;
                }

                if (ultimoTreino === null) {
                    dias = 1;

                } else {

                    const ultimo = new Date(ultimoTreino);
                    const diferenca = hoje - ultimo;
                    const diferencaEmdias = diferenca / (1000 * 60 * 60 * 24);

                    if (diferencaEmdias >= 1 && diferencaEmdias < 2) {
                        dias = dias + 1;
                    } else {

                        dias = 1;
                    }

                    ultimoTreino = hoje.toDateString();

                    localStorage.setItem("ultimoTreino", ultimoTreino);

                    console.log(hoje.toDateString());


                    localStorage.setItem("dias", dias);
                    ofensiva.textContent =
                        "Ofensiva atual:" + dias + "dias";
                    alert("Treino marcado! ");
                });
    </script>

</body>

</html>
